<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background gradient: dark navy -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1220"/>
      <stop offset="50%" stop-color="#0d1128"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
    <!-- Amber glow -->
    <radialGradient id="glowAmber" cx="70%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <!-- Teal glow -->
    <radialGradient id="glowTeal" cx="15%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <!-- Purple glow -->
    <radialGradient id="glowPurple" cx="85%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <!-- Surface gradient for cards -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Mug gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Pen gradient -->
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Bag gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Shirt gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Notebook gradient -->
    <linearGradient id="notebookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glowAmber)"/>
  <rect width="800" height="450" fill="url(#glowTeal)"/>
  <rect width="800" height="450" fill="url(#glowPurple)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.8" fill="#ffffff" fill-opacity="0.06"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots)"/>

  <!-- ── MUG (center-left) ──────────────────────────────────── -->
  <g transform="translate(145, 165)" filter="url(#shadow)">
    <!-- Mug body -->
    <rect x="0" y="0" width="110" height="120" rx="10" fill="url(#mugGrad)"/>
    <!-- Mug handle -->
    <path d="M110 30 Q145 30 145 60 Q145 90 110 90" fill="none" stroke="#ea580c" stroke-width="14" stroke-linecap="round"/>
    <!-- Mug lip -->
    <rect x="-5" y="-6" width="120" height="18" rx="9" fill="#f97316" fill-opacity="0.4"/>
    <!-- Logo placeholder on mug -->
    <rect x="20" y="35" width="70" height="50" rx="6" fill="#ffffff" fill-opacity="0.15"/>
    <text x="55" y="55" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-size="9" font-family="monospace" font-weight="bold">LOGO</text>
    <line x1="30" y1="65" x2="80" y2="65" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="30" y1="72" x2="65" y2="72" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- ── TOTE BAG (left) ─────────────────────────────────────── -->
  <g transform="translate(30, 130)" filter="url(#shadow)">
    <!-- Bag handles -->
    <path d="M30 40 Q30 5 55 5 Q80 5 80 40" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
    <!-- Bag body -->
    <rect x="0" y="35" width="110" height="130" rx="8" fill="url(#bagGrad)"/>
    <!-- Bag logo area -->
    <rect x="22" y="65" width="66" height="55" rx="5" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="55" cy="87" r="14" fill="#ffffff" fill-opacity="0.2"/>
    <text x="55" y="91" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-size="8" font-family="monospace" font-weight="bold">PL</text>
    <!-- Decorative stripes -->
    <line x1="10" y1="145" x2="100" y2="145" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- ── NOTEBOOK (center) ──────────────────────────────────── -->
  <g transform="translate(300, 140)" filter="url(#shadow)">
    <!-- Notebook cover -->
    <rect x="0" y="0" width="130" height="170" rx="8" fill="url(#notebookGrad)"/>
    <!-- Spine detail -->
    <rect x="0" y="0" width="18" height="170" rx="4" fill="#dc2626" fill-opacity="0.6"/>
    <!-- Binding dots -->
    <circle cx="9" cy="30"  r="3" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="9" cy="50"  r="3" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="9" cy="70"  r="3" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="9" cy="90"  r="3" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="9" cy="110" r="3" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="9" cy="130" r="3" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="9" cy="150" r="3" fill="#ffffff" fill-opacity="0.5"/>
    <!-- Page lines on cover -->
    <rect x="28" y="40"  width="85" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="28" y="52"  width="70" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="28" y="64"  width="80" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.2"/>
    <!-- Logo area -->
    <rect x="28" y="85" width="85" height="55" rx="5" fill="#ffffff" fill-opacity="0.1"/>
    <text x="70" y="107" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-size="10" font-family="sans-serif" font-weight="bold">PrintLine</text>
    <text x="70" y="122" text-anchor="middle" fill="#ffffff" fill-opacity="0.5" font-size="7" font-family="sans-serif">Werbetechnik</text>
  </g>

  <!-- ── PEN (diagonal, foreground) ────────────────────────────── -->
  <g transform="rotate(-35, 500, 280) translate(430, 150)" filter="url(#shadow)">
    <!-- Pen barrel -->
    <rect x="0" y="0" width="190" height="18" rx="9" fill="url(#penGrad)"/>
    <!-- Pen clip -->
    <rect x="155" y="-4" width="8" height="28" rx="4" fill="#06b6d4"/>
    <!-- Pen tip -->
    <polygon points="190,2 190,16 215,9" fill="#0e7490"/>
    <!-- Pen end cap -->
    <rect x="0" y="0" width="22" height="18" rx="9" fill="#0891b2"/>
    <!-- Logo on pen -->
    <text x="80" y="12" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-size="7" font-family="monospace" font-weight="bold">PRINTLINE</text>
  </g>

  <!-- ── T-SHIRT (right) ────────────────────────────────────── -->
  <g transform="translate(555, 100)" filter="url(#shadow)">
    <!-- Shirt body shape -->
    <path d="M40 0 L0 35 L20 40 L15 170 L155 170 L150 40 L170 35 L130 0 Q110 25 85 25 Q60 25 40 0Z"
          fill="url(#shirtGrad)"/>
    <!-- Collar detail -->
    <path d="M40 0 Q85 10 130 0 Q110 25 85 25 Q60 25 40 0Z" fill="#f59e0b" fill-opacity="0.6"/>
    <!-- Logo/print area -->
    <rect x="35" y="55" width="100" height="75" rx="6" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="85" cy="85" r="18" fill="#ffffff" fill-opacity="0.18"/>
    <text x="85" y="89" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-size="11" font-family="sans-serif" font-weight="bold">PL</text>
    <text x="85" y="110" text-anchor="middle" fill="#ffffff" fill-opacity="0.5" font-size="7" font-family="sans-serif">Werbeartikel</text>
  </g>

  <!-- ── KEYRING / SMALL ITEM (bottom center) ───────────────── -->
  <g transform="translate(460, 330)">
    <circle cx="30" cy="20" r="18" fill="none" stroke="#f97316" stroke-width="4" opacity="0.8"/>
    <circle cx="30" cy="20" r="10" fill="#f97316" fill-opacity="0.3"/>
    <line x1="30" y1="2" x2="30" y2="-12" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="30" cy="-18" rx="8" ry="5" fill="none" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- ── Floating label badges ─────────────────────────────────── -->
  <!-- "mit Ihrem Logo" badge -->
  <g transform="translate(320, 65)">
    <rect x="0" y="0" width="145" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.35" stroke-width="1"/>
    <text x="72" y="21" text-anchor="middle" fill="#fb923c" font-size="11" font-family="sans-serif" font-weight="600">mit Ihrem Logo</text>
  </g>

  <!-- "Individuelle Veredelung" badge -->
  <g transform="translate(500, 360)">
    <rect x="0" y="0" width="190" height="32" rx="16" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="95" y="21" text-anchor="middle" fill="#2dd4bf" font-size="11" font-family="sans-serif" font-weight="600">Individuelle Veredelung</text>
  </g>

  <!-- Decorative sparkle dots -->
  <circle cx="700" cy="80"  r="2" fill="#f97316" fill-opacity="0.6"/>
  <circle cx="720" cy="95"  r="1" fill="#f97316" fill-opacity="0.4"/>
  <circle cx="710" cy="70"  r="1.5" fill="#fbbf24" fill-opacity="0.5"/>
  <circle cx="100" cy="390" r="2" fill="#14b8a6" fill-opacity="0.5"/>
  <circle cx="80"  cy="375" r="1" fill="#14b8a6" fill-opacity="0.4"/>
</svg>
